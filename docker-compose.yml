version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: ticketing-postgres
    environment:
      POSTGRES_DB: ticketing_dev
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: